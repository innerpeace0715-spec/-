[package]
name = "filemoa"
version = "0.3.3"
description = "Safe local file organization for Windows and Galaxy Tab"
authors = ["FileMoa"]
edition = "2021"

[lib]
name = "filemoa_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
tauri = { version = "2.11.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.4.1"
tauri-plugin-store = "2.4.1"
tauri-plugin-process = "2.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
tokio = { version = "1", default-features = false, features = ["time"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std", "tls12"] }

# Self-update and the one-window rule only exist on the desktop; Android
# installs the APK and runs one activity by itself.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.11.0"
tauri-plugin-single-instance = "2"

# Android has no platform verifier set up for Rust, so TLS uses bundled roots.
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0
incremental = false

# Hashing gigabytes in an unoptimised build is ~10x slower and makes dev tests
# of the duplicate scan misleading.
[profile.dev.package.sha2]
opt-level = 3
